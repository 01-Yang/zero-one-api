name: Zero One Visual Calibration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-calibration:
    name: Chromium calibration (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
    env:
      CI: "true"
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Install visual test dependencies
        run: npm ci --prefix visual-regression
      - name: Audit visual test dependencies
        run: npm audit --prefix visual-regression --audit-level=high
      - name: Install Landing dependencies
        run: npm ci --prefix landing
      - name: Install Console dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Typecheck visual contracts
        run: npm run typecheck --prefix visual-regression
      - name: List visual contracts
        run: npm run test:list --prefix visual-regression
      - name: Run snapshot calibration without baseline updates
        id: calibration
        continue-on-error: true
        run: npm test --prefix visual-regression
      - name: Report calibration result
        if: always()
        env:
          CALIBRATION_OUTCOME: ${{ steps.calibration.outcome }}
        run: |
          if [ "$CALIBRATION_OUTCOME" = success ]; then
            echo 'Visual calibration passed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'Visual calibration is advisory until reviewed Linux baselines are committed.' >> "$GITHUB_STEP_SUMMARY"
          echo '::warning::Visual calibration failed; inspect the uploaded Playwright report and artifacts.'
      - name: Upload visual calibration artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zero-one-visual-calibration-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            visual-regression/playwright-report/
            visual-regression/test-results/
