<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>零一 API 首页设计对比</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; background: #111; color: #fff; }
      h1 { margin: 0 0 20px; font-size: 20px; }
      h2 { margin: 0 0 10px; color: #bbb; font-size: 14px; font-weight: 500; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
      figure { min-width: 0; margin: 0; padding: 12px; border: 1px solid #333; background: #050505; }
      figcaption { margin-bottom: 10px; color: #aaa; font-size: 12px; }
      img { width: 100%; height: auto; display: block; }
    </style>
  </head>
  <body>
    <h1>同视口视觉比较 · 1440 × 900</h1>
    <h2>首屏</h2>
    <div class="row">
      <figure><figcaption>参考站结构</figcaption><img src="reference-1440-top.png" alt="参考站桌面首屏" /></figure>
      <figure><figcaption>零一 API 黑白实现（最终）</figcaption><img src="local-1440-top-final.png" alt="零一 API 桌面首屏" /></figure>
    </div>
    <h2>价格框架</h2>
    <div class="row">
      <figure><figcaption>参考站价格区</figcaption><img src="reference-1440-pricing.png" alt="参考站桌面价格区" /></figure>
      <figure><figcaption>零一 API 本地价格区（最终）</figcaption><img src="local-1440-pricing-final.png" alt="零一 API 桌面价格区" /></figure>
    </div>
    <h2>本地移动端补充验收 · 390 × 844</h2>
    <div class="row">
      <figure><figcaption>首屏</figcaption><img src="local-390-top-final.png" alt="零一 API 移动端首屏" /></figure>
      <figure><figcaption>价格区</figcaption><img src="local-390-pricing-final.png" alt="零一 API 移动端价格区" /></figure>
    </div>
  </body>
</html>
